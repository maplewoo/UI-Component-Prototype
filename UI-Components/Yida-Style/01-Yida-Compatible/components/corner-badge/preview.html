<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CornerBadge 预览</title>
<style>
  body { margin: 0; padding: 32px; background: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; align-items: center; margin-bottom: 28px; }
  .cap { font-size: 12px; color: rgba(0,0,0,0.45); margin: 0 0 8px; }
  .btn { position: relative; display: inline-flex; align-items: center; height: 32px; padding: 0 15px;
    border: 1px solid #1677ff; background: #1677ff; color: #fff; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .btn[disabled] { background: #f5f5f5; border-color: #d9d9d9; color: rgba(0,0,0,0.25); cursor: not-allowed; }

  /* ==== component ==== */
  .corner-badge { font-variant-numeric: tabular-nums; }
  .corner-badge.corner { position: absolute; top: -8px; right: -8px; min-width: 18px; height: 18px;
    padding: 0 5px; border-radius: 9px; background: #F44336; color: #fff; font-size: 12px; font-weight: 500;
    line-height: 18px; text-align: center; z-index: 2; pointer-events: none; }
  .corner-badge.inline { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
    padding: 0 5px; border-radius: 9px; background: rgba(255,255,255,0.28); color: #fff; font-size: 12px; font-weight: 500;
    line-height: 1; margin-left: 6px; }
</style>
</head>
<body>
  <p class="cap">corner：右上角红角标（无白圈）</p>
  <div class="row">
    <button class="btn">保存修改<span class="corner-badge corner">3</span></button>
    <button class="btn">新建<span class="corner-badge corner">12</span></button>
    <button class="btn">超长<span class="corner-badge corner">128</span></button>
    <button class="btn" disabled>保存修改（禁用不渲染）</button>
    <button class="btn">count=0 不渲染（应为空）</button>
  </div>

  <p class="cap">inline：按钮内计数胶囊（0 也显示）</p>
  <div class="row">
    <button class="btn">批量设为不适用<span class="corner-badge inline">5</span></button>
    <button class="btn" disabled>批量设为不适用<span class="corner-badge inline">0</span></button>
  </div>
</body>
</html>

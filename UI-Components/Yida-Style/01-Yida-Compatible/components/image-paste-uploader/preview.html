<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ImagePasteUploader 预览</title>
<style>
  :root{ --brand:#1677ff; --danger:#f44336; --r-ctrl:6px; --r-small:4px; --f-body:14px; --h-ctrl:28px; }
  body { margin: 0; padding: 32px; background: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .cap { font-size: 12px; color: rgba(0,0,0,0.45); margin: 18px 0 8px; }
  .row { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start; }

  /* ==== component ==== */
  .ip-cell { width: 112px; margin: 0 auto; }
  .ip-up { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 112px; height: var(--h-ctrl,28px); padding: 0; border-radius: var(--r-ctrl,6px); font-size: var(--f-body,14px); font-weight: 400;
    cursor: pointer; white-space: nowrap; overflow: hidden; border: 1px solid var(--brand,#1677ff); background: var(--brand,#1677ff); color: #fff; }
  .ip-up:hover { background: #4096ff; border-color: #4096ff; }
  .ip-up.armed { background: #fff; color: var(--brand,#1677ff); }
  .ip-lamp { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: ip-blink 1.1s ease-in-out infinite; }
  @keyframes ip-blink { 0%,100%{opacity:1;} 50%{opacity:.22;} }
  .ip-thumbs { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
  .ip-thumb-wrap { position: relative; display: inline-block; }
  .ip-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; border: 1px solid #e8e8e8; cursor: pointer; display:block; }
  .ip-thumb-x { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 4px; background: var(--danger,#f44336); border: 1px solid #e8e8e8; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity .18s ease; z-index: 2; line-height: 0; }
  .ip-thumb-wrap:hover .ip-thumb-x { opacity: 1; }
  .hint { font-size: 12px; color: rgba(0,0,0,0.45); margin-top: 4px; text-align: center; }
</style>
</head>
<body>
  <p class="cap">idle → armed（灯点呼吸闪烁）→ 有图（hover 显删除 X）→ 只读</p>
  <div class="row">
    <div><div class="ip-cell"><button class="ip-up">图片上传</button></div><div class="hint">idle</div></div>
    <div><div class="ip-cell"><span class="ip-up armed"><span class="ip-lamp"></span>Ctrl+V</span></div><div class="hint">armed</div></div>
    <div>
      <div class="ip-cell">
        <button class="ip-up">图片上传</button>
        <div class="ip-thumbs">
          <span class="ip-thumb-wrap"><img class="ip-thumb" alt="图示1" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><rect width='48' height='48' fill='%23dfe7ef'/><text x='24' y='28' font-size='12' text-anchor='middle' fill='%23808a97'>1</text></svg>"><span class="ip-thumb-x"><svg viewBox='0 0 12 12' width='9' height='9' fill='none' stroke='white' stroke-width='2'><path d='M3 3l6 6M9 3l-6 6'/></svg></span></span>
          <span class="ip-thumb-wrap"><img class="ip-thumb" alt="图示2" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><rect width='48' height='48' fill='%23e7eee6'/><text x='24' y='28' font-size='12' text-anchor='middle' fill='%23808a97'>2</text></svg>"><span class="ip-thumb-x"><svg viewBox='0 0 12 12' width='9' height='9' fill='none' stroke='white' stroke-width='2'><path d='M3 3l6 6M9 3l-6 6'/></svg></span></span>
        </div>
      </div>
      <div class="hint">有图（两图间隙=16，48+16+48=112）</div>
    </div>
    <div>
      <div class="ip-cell" style="display:flex;flex-wrap:wrap;gap:4px;">
        <img class="ip-thumb" alt="图示1" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><rect width='48' height='48' fill='%23dfe7ef'/></svg>">
        <img class="ip-thumb" alt="图示2" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><rect width='48' height='48' fill='%23e7eee6'/></svg>">
      </div>
      <div class="hint">只读（无按钮/删除）</div>
    </div>
  </div>
</body>
</html>

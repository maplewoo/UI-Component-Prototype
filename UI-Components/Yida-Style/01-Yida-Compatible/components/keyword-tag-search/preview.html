<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KeywordTagSearch 预览</title>
<style>
  body { margin: 0; padding: 32px; background: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: rgba(0,0,0,0.88); }
  .cap { font-size: 12px; color: rgba(0,0,0,0.45); margin: 18px 0 6px; }
  .box { width: 280px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; padding: 3px 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 4px; background: #f0f0f0; font-size: 12px; }
  .tag i { font-style: normal; color: rgba(0,0,0,0.25); cursor: pointer; }
  .ph { color: rgba(0,0,0,0.25); font-size: 14px; }

  /* ==== panel ==== */
  .kt-panel { width: 280px; background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(16,24,40,0.14); }
  .kt-hint { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 10px; font-size: 14px; }
  .kt-hint .kt-cnt { margin-left: auto; }
  .kt-opt { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 10px; border-radius: 4px; font-size: 14px; cursor: pointer; }
  .kt-opt:hover { background: #f5f7fa; }
  .kt-opt.sel { background: #e6f4ff; font-weight: 600; }
  .kt-chk { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #d9d9d9; background: #fff; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; }
  .kt-chk.on { background: #1677ff; border-color: #1677ff; }
  .kt-chk svg { width: 10px; height: 10px; }
  .kt-dot { width: 8px; height: 8px; border-radius: 2px; background: #d9d9d9; flex: 0 0 auto; }
  .kt-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(0,0,0,0.45); }
  .kt-cnt { margin-left: auto; font-size: 12px; color: rgba(0,0,0,0.45); font-variant-numeric: tabular-nums; }
  .kt-cnt.zero { color: rgba(0,0,0,0.25); }
  .kt-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-top: 1px solid #f0f0f0; margin-top: 4px; font-size: 12px; color: rgba(0,0,0,0.45); }
  .kt-link { color: #1677ff; cursor: pointer; }
</style>
</head>
<body>
  <p class="cap">已选标签（输入框内）</p>
  <div class="box"><span class="tag">面差<i>×</i></span><span class="ph">按回车添加</span></div>

  <p class="cap">展开面板：命中已存在词的提示 + 历史项 + 模式切换底栏</p>
  <div class="kt-panel">
    <div class="kt-hint">按回车添加「间隙」<span class="kt-cnt">5</span></div>
    <div class="kt-opt sel"><span class="kt-chk on"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg></span><i class="kt-dot"></i><span class="kt-name">面差</span><span class="kt-cnt">8</span></div>
    <div class="kt-opt"><span class="kt-chk"></span><i class="kt-dot"></i><span class="kt-name">卡扣</span><span class="kt-cnt">3</span></div>
    <div class="kt-opt"><span class="kt-chk"></span><i class="kt-dot"></i><span class="kt-name">配合尺寸</span><span class="kt-cnt zero">0</span></div>
    <div class="kt-foot"><span>模式[任一]</span><span class="kt-link">改为[全部]</span></div>
  </div>
</body>
</html>

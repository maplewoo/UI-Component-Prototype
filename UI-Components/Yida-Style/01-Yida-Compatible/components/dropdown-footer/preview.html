<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DropdownFooter 预览</title>
<style>
  body { margin: 0; padding: 32px; background: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: rgba(0,0,0,0.88); }
  .cap { font-size: 12px; color: rgba(0,0,0,0.45); margin: 18px 0 6px; }

  /* ==== 面板元素（真实场景在 popupClassName 作用域，此处展开演示） ==== */
  .df-panel { width: 240px; background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(16,24,40,0.14); }
  .df-opt { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 5px 10px; font-size: 14px; cursor: pointer; }
  .df-opt:hover { background: #f5f7fa; }
  .df-opt.selected { background: #e6f4ff; font-weight: 600; }
  .df-chk { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #d9d9d9; background: #fff; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
  .df-chk.on { background: #1677ff; border-color: #1677ff; }
  .df-chk svg { width: 10px; height: 10px; }
  .df-count { margin-left: auto; font-size: 12px; color: rgba(0,0,0,0.45); font-variant-numeric: tabular-nums; }
  .df-count.zero { color: rgba(0,0,0,0.25); }
  .df-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-top: 1px solid #f0f0f0; margin-top: 4px; font-size: 12px; color: rgba(0,0,0,0.45); }
  .df-link { color: #1677ff; cursor: pointer; }
</style>
</head>
<body>
  <p class="cap">多选下拉面板：自定义勾选框 + 右侧计数 + 底部"已选/清空"</p>
  <div class="df-panel">
    <div class="df-opt"><span class="df-chk on"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg></span>前围总成<span class="df-count">12</span></div>
    <div class="df-opt selected"><span class="df-chk on"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg></span>侧围总成<span class="df-count">8</span></div>
    <div class="df-opt"><span class="df-chk"></span>后背门<span class="df-count zero">0</span></div>
    <div class="df-foot"><span>已选 2 项</span><span class="df-link">清空</span></div>
  </div>

  <p class="cap">底栏右侧可换成其它操作（示例：模式切换）</p>
  <div class="df-panel">
    <div class="df-opt"><span class="df-chk on"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg></span>关键词A<span class="df-count">3</span></div>
    <div class="df-foot"><span>模式[任一]</span><span class="df-link">改为[全部]</span></div>
  </div>
</body>
</html>

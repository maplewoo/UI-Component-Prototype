<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FullscreenEditCard 预览</title>
<style>
  :root{ --line:#f0f0f0; --head-bg:#fafbfc; --t1:rgba(0,0,0,.88); --brand:#1677ff; --r-card:8px;
    --sh-full:0 8px 32px rgba(0,0,0,.20); --z-full:950; }
  body { margin: 0; padding: 32px; background: #f2f3f5;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .cap { font-size: 12px; color: rgba(0,0,0,0.45); margin: 18px 0 6px; }
  .stage { position: relative; height: 360px; border: 1px dashed #d9d9d9; border-radius: 8px; overflow: hidden; background: #fff; }

  /* normal */
  .fc-card { display: flex; flex-direction: column; max-height: calc(100% - 8px); background: #fff; border: 1px solid var(--line); border-radius: var(--r-card); }
  .fc-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; background: var(--head-bg); border-bottom: 1px solid var(--line); }
  .fc-title { font-size: 16px; font-weight: 600; color: var(--t1); }
  .fc-actions { display: flex; align-items: center; gap: 8px; }
  .fc-btn { height: 28px; padding: 0 10px; border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .fc-iconbtn { height: 28px; width: 28px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: rgba(0,0,0,0.65); border-radius: 6px; cursor: pointer; }
  .fc-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px; color: rgba(0,0,0,0.65); }

  /* fullscreen 演示（在 .stage 内用 absolute 模拟 fixed） */
  .fc-card.demo-fs { position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; margin: 0; max-height: none; z-index: var(--z-full,950); box-shadow: var(--sh-full, 0 8px 32px rgba(0,0,0,.20)); }
</style>
</head>
<body>
  <p class="cap">普通态（内部滚动）</p>
  <div class="stage"><div class="fc-card" style="margin:4px 4px 0;">
    <div class="fc-head"><span class="fc-title">小米 TEST 后门固定窗</span>
      <div class="fc-actions"><button class="fc-btn">保存修改</button><button class="fc-iconbtn" title="全屏编辑检查列表"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"/></svg></button></div>
    </div>
    <div class="fc-body">长列表在卡体内滚动，整页不滚…</div>
  </div></div>

  <p class="cap">全屏态（fixed 铺满、内缩 12、抬升阴影、按钮变"退出"）</p>
  <div class="stage"><div class="fc-card demo-fs">
    <div class="fc-head"><span class="fc-title">小米 TEST 后门固定窗</span>
      <div class="fc-actions"><button class="fc-btn">保存修改</button><button class="fc-iconbtn" title="退出全屏（Esc）"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6h4V2M14 6h-4V2M2 10h4v4M14 10h-4v4"/></svg></button></div>
    </div>
    <div class="fc-body">铺满视口（内缩 12）、body 锁滚动、Esc 退出…</div>
  </div></div>
</body>
</html>

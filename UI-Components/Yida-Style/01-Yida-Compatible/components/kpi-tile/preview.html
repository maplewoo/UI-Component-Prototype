<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KpiTile 预览</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 32px; background: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
  .cap { font-size: 12px; color: rgba(0,0,0,0.45); margin: 0 0 8px; }

  /* ==== component ==== */
  .kpi-tile { position: relative; overflow: hidden; flex: 0 0 98px; width: 98px;
    padding: 10px 6px 8px; text-align: center; background: #fff;
    border: 1px solid #f0f0f0; border-radius: 8px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); }
  .kpi-tile::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--kc, #ccc); }
  .kpi-tile-label { display: block; font-size: 12px; color: rgba(0,0,0,0.65); margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-tile-value { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -0.2px;
    color: var(--kc, rgba(0,0,0,0.88)); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <p class="cap">默认（语义色由宿主传入，此处为示例色）</p>
  <div class="row">
    <div class="kpi-tile" style="--kc:#F44336"><span class="kpi-tile-label">待处理</span><span class="kpi-tile-value">12</span></div>
    <div class="kpi-tile" style="--kc:#19C355"><span class="kpi-tile-label">已完成</span><span class="kpi-tile-value">128</span></div>
    <div class="kpi-tile" style="--kc:#FFB300"><span class="kpi-tile-label">进行中</span><span class="kpi-tile-value">7</span></div>
  </div>

  <p class="cap">无 color（回落） + loading 占位</p>
  <div class="row">
    <div class="kpi-tile"><span class="kpi-tile-label">默认色</span><span class="kpi-tile-value">34</span></div>
    <div class="kpi-tile" style="--kc:#1677ff"><span class="kpi-tile-label">加载中</span><span class="kpi-tile-value" style="color:rgba(0,0,0,0.25)">—</span></div>
    <div class="kpi-tile" style="--kc:#1677ff"><span class="kpi-tile-label">标签很长会被省略号</span><span class="kpi-tile-value">9999</span></div>
  </div>
</body>
</html>

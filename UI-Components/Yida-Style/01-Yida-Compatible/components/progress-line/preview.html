<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProgressLine 预览</title>
<style>
  body { margin: 0; padding: 32px; background: #f5f7fa; max-width: 520px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .cap { font-size: 12px; color: rgba(0,0,0,0.45); margin: 18px 0 6px; }

  /* ==== component ==== */
  .progress-line { display: flex; align-items: center; gap: 12px; }
  .pl-label { font-size: 14px; color: rgba(0,0,0,0.65); }
  .pl-track { position: relative; flex: 1 1 auto; height: 14px; border-radius: 99px; background: var(--track, #eef0f3); overflow: hidden; }
  .pl-track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--pc, #19C355); }
  .pl-pct { font-size: 20px; font-weight: 600; line-height: 1.2; color: var(--pc, #19C355); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <p class="cap">默认绿 + 自定义蓝/琥珀</p>
  <div class="progress-line" style="--pc:#19C355"><span class="pl-label">自查完成率</span><span class="pl-track"><i style="width:72%"></i></span><span class="pl-pct">72%</span></div>
  <div class="progress-line" style="--pc:#1677ff"><span class="pl-label">复查完成率</span><span class="pl-track"><i style="width:40%"></i></span><span class="pl-pct">40%</span></div>
  <div class="progress-line" style="--pc:#FFB300"><span class="pl-label">进度</span><span class="pl-track"><i style="width:90%"></i></span><span class="pl-pct">90%</span></div>

  <p class="cap">边界：0% / 100% / 无标签</p>
  <div class="progress-line" style="--pc:#19C355"><span class="pl-label">未开始</span><span class="pl-track"><i style="width:0%"></i></span><span class="pl-pct">0%</span></div>
  <div class="progress-line" style="--pc:#19C355"><span class="pl-label">全部完成</span><span class="pl-track"><i style="width:100%"></i></span><span class="pl-pct">100%</span></div>
  <div class="progress-line" style="--pc:#F44336"><span class="pl-track"><i style="width:55%"></i></span><span class="pl-pct">55%</span></div>

  <p class="cap">更细的轨道（height 变体 = 8px）</p>
  <div class="progress-line" style="--pc:#19C355"><span class="pl-label">细条</span><span class="pl-track" style="height:8px"><i style="width:64%"></i></span><span class="pl-pct">64%</span></div>
</body>
</html>

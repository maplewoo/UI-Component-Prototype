<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AttachmentChip 预览</title>
<style>
  :root{
    --brand:#1677ff; --brand-hover:#69b1ff; --danger:#f44336; --j-pass:#19c355;
    --h-ctrl:28px; --r-ctrl:6px;
  }
  body { margin: 0; padding: 32px; background: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .cap { font-size: 12px; color: rgba(0,0,0,0.45); margin: 18px 0 8px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }

  /* ==== component ==== */
  .att-chip { position: relative; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; width: 112px; height: var(--h-ctrl, 28px); padding: 0; border-radius: var(--r-ctrl, 6px);
    font-size: 14px; font-weight: 400; cursor: pointer; white-space: nowrap; overflow: hidden;
    border: 1px solid var(--brand, #1677ff); background: var(--brand, #1677ff); color: #fff; font-family: inherit; }
  .att-chip.server { background: #fff; color: var(--brand, #1677ff); }
  .att-chip.uploaded { background: var(--j-pass, #19c355); border-color: var(--j-pass, #19c355); color: #fff; }
  .att-chip.empty:hover { background: #4096ff; border-color: #4096ff; }
  .ac-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand-hover, #69b1ff); }
  .att-chip .ac-txt { position: relative; display: inline-flex; align-items: center; gap: 6px; transition: transform .18s cubic-bezier(0.4,0,0.2,1); }
  .att-chip.delable:hover .ac-txt { transform: translateX(-14px); }
  .ac-del { position: absolute; top: 0; right: -28px; width: 28px; height: 100%;
    background: var(--danger, #f44336); color: #fff; display: flex; align-items: center; justify-content: center;
    border-radius: 0 5px 5px 0; transition: right .18s cubic-bezier(0.4,0,0.2,1); cursor: pointer; }
  .att-chip:hover .ac-del { right: 0; }
  .hint { font-size: 12px; color: rgba(0,0,0,0.45); margin-top: 4px; width: 112px; text-align: center; }
</style>
</head>
<body>
  <p class="cap">五态（悬停"已上传/当前附件"可见右侧删除 X 划入）</p>
  <div class="row">
    <div><button class="att-chip empty"><span class="ac-txt">上传附件</span></button><div class="hint">空态</div></div>
    <div><button class="att-chip uploading"><i class="ac-fill" style="width:48%"></i><span class="ac-txt">48%</span></button><div class="hint">上传中(只显示 N%)</div></div>
    <div><button class="att-chip delable uploaded"><span class="ac-txt">已上传</span><span class="ac-del"><svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="#fff" stroke-width="2"><path d="M3 3l6 6M9 3l-6 6"/></svg></span></button><div class="hint">已上传(fresh)</div></div>
    <div><button class="att-chip server delable"><span class="ac-txt">当前附件</span><span class="ac-del"><svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="#fff" stroke-width="2"><path d="M3 3l6 6M9 3l-6 6"/></svg></span></button><div class="hint">当前附件(服务器)</div></div>
    <div><button class="att-chip server"><span class="ac-txt">当前附件</span></button><div class="hint">只读(无删除)</div></div>
  </div>
</body>
</html>
